[project]
name = "voice-processing-system"
version = "0.1.0"
description = "语音处理系统：采集 / 处理 / 显示 / 播放 + 语音克隆"
requires-python = ">=3.11,<3.12"
readme = "AGENT.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "numpy>=1.26,<2.2",
    "scipy>=1.13",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "httpx>=0.27",
    "pyinstaller>=6.10",
]
prod = [
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "services"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
