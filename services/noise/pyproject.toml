[project]
name = "noise-service"
version = "0.1.0"
description = "语音加噪与降噪子服务：可调信噪比加噪 + 谱减法降噪（主干经 NoiseProvider 以 HTTP 对接）"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "numpy>=1.26,<2.2",
    "soundfile>=0.12",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
