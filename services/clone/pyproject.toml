[project]
name = "clone-adapter"
version = "0.1.0"
description = "语音克隆适配层：主干与 GPT-SoVITS 引擎之间的轻量 HTTP 桥"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "soundfile>=0.12",
    "numpy>=1.26,<2.2",
    "python-multipart>=0.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
